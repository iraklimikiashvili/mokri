<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ონლაინ მაღაზია — MOKRI</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+Georgian:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A1728;--bg2:#0d1e35;--blue:#4D9BFD;--white:#FEFEFE;--dim:rgba(254,254,254,.72);--border:rgba(77,155,253,.24)}*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:'Noto Sans Georgian',sans-serif;background:linear-gradient(165deg,var(--bg),var(--bg2));color:var(--white);min-height:100vh}
.header{position:sticky;top:0;display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;column-gap:14px;padding:0 20px;height:64px;background:rgba(10,23,40,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.brand{font-family:'Orbitron',sans-serif;font-weight:900;font-size:18px;letter-spacing:3px;color:var(--white);text-decoration:none}.brand span{color:var(--blue)}
.nav{display:flex;flex-wrap:nowrap;gap:8px;min-width:0;overflow-x:auto;padding-bottom:2px}.nav a{color:var(--dim);text-decoration:none;padding:8px 12px;min-height:36px;border-radius:999px;border:1px solid transparent;white-space:nowrap;flex:0 0 auto;font-size:13px;font-weight:600;line-height:1.2;touch-action:manipulation}.nav a.active,.nav a:hover{border-color:var(--border);background:rgba(77,155,253,.14);color:var(--white)}
.wrap{max-width:900px;margin:0 auto;padding:60px 20px}
.card{padding:28px;border-radius:14px;border:1px solid var(--border);background:rgba(255,255,255,.06)}
.h1{font-family:'Orbitron',sans-serif;font-size:clamp(28px,5vw,46px);margin-bottom:12px}.h1 span{color:var(--blue)}
.lead{color:var(--dim);font-size:17px;line-height:1.7;margin-bottom:20px}
.badge{display:inline-block;padding:6px 10px;border-radius:999px;border:1px solid var(--border);background:rgba(77,155,253,.16);font-size:12px;margin-bottom:14px}
.actions{display:flex;flex-wrap:wrap;gap:10px}.btn{display:inline-block;text-decoration:none;padding:11px 16px;border-radius:8px;font-weight:700}.btn-primary{background:var(--blue);border:1px solid var(--blue);color:var(--bg)}.btn-ghost{border:1px solid var(--border);color:var(--white)}
@media (max-width:600px){.header{padding:8px 12px;column-gap:10px}.nav a{font-size:12px;padding:7px 10px;min-height:34px}}
</style>
</head>
<body>
<header class="header">
  <a class="brand" href="index.html">MOK<span>RI</span></a>
  <nav class="nav" aria-label="Main navigation">
    <a href="individuals.html">ფიზიკური პირები</a>
    <a href="business.html">იურიდიული პირები</a>
    <a href="about.html">ჩვენს შესახებ</a>
    <a class="active" href="shop.html">ონლაინ მაღაზია</a>
  </nav>
</header>
<main class="wrap">
  <section class="card">
    <div class="badge">MOKRI SHOP</div>
    <h1 class="h1">ონლაინ <span>მაღაზია</span></h1>
    <p class="lead">მაღაზიის განყოფილება მზადდება. აქ განთავსდება IT ტექნიკა, პერიფერია, ქსელის მოწყობილობები და პროფესიული რეკომენდაციები არჩევისთვის.</p>
    <div class="actions">
      <a class="btn btn-primary" href="https://wa.me/995555555555?text=%E1%83%9B%E1%83%90%E1%83%A0%E1%83%97%E1%83%95%E1%83%90%E1%83%96%E1%83%98%E1%83%90%E1%83%A1%20%E1%83%A8%E1%83%94%E1%83%A1%E1%83%90%E1%83%AE%E1%83%94%E1%83%91%20%E1%83%A1%E1%83%98%E1%83%90%E1%83%AE%E1%83%9A%E1%83%94%E1%83%94%E1%83%91%E1%83%98%20%E1%83%9B%E1%83%98%E1%83%9B%E1%83%98%E1%83%AC%E1%83%94%E1%83%A0%E1%83%94%E1%83%97" target="_blank" rel="noopener noreferrer">შემატყობინე გახსნისას</a>
      <a class="btn btn-ghost" href="index.html">მთავარ გვერდზე დაბრუნება</a>
    </div>
  </section>
</main>
</body>
</html>
