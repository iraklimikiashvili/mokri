<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- ═══ Security Headers ═══ -->
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta http-equiv="X-Frame-Options" content="DENY">
<meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
<meta http-equiv="Permissions-Policy" content="geolocation=(), microphone=(), camera=()">
<title>MOKRI — ფიზიკური პირები | IT Solutions</title>
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Noto+Sans+Georgian:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A1728;
    --bg2: #0d1e35;
    --bg3: #0f2240;
    --navy: #1A3B6C;
    --blue: #4D9BFD;
    --blue-dim: rgba(77,155,253,0.15);
    --blue-glow: rgba(77,155,253,0.35);
    --white: #FEFEFE;
    --white-dim: rgba(254,254,254,0.65);
    --white-faint: rgba(254,254,254,0.08);
    --border: rgba(77,155,253,0.2);
    --header-h: 68px;
  }

  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--white);
    font-family: 'EB Garamond', Georgia, serif;
    overflow-x: hidden;
    line-height: 1.7;
  }

  body::before {
    content:'';
    position:fixed;
    inset:0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.035'/%3E%3C/svg%3E");
    pointer-events:none;
    z-index:0;
    opacity:.4;
  }

  /* ═══════════════ HEADER ═══════════════ */
  .site-header {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 1000;
    height: var(--header-h);
    background: rgba(10,23,40,0.95);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
  }

  .header-inner {
    max-width: 1400px;
    margin: 0 auto;
    height: 100%;
    padding: 0 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .header-logo {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: 18px;
    letter-spacing: 4px;
    color: var(--white);
    text-decoration: none;
    flex-shrink: 0;
    transition: opacity 0.2s;
  }
  .header-logo:hover { opacity: 0.8; }
  .header-logo span { color: var(--blue); }

  .header-nav {
    display: flex;
    align-items: center;
    gap: 2px;
    flex: 1;
    justify-content: center;
  }

  .nav-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    font-family: 'Noto Sans Georgian', sans-serif;
    font-size: 13px;
    font-weight: 400;
    color: var(--white-dim);
    text-decoration: none;
    border-radius: 8px;
    transition: all 0.22s;
    white-space: nowrap;
    border: 1px solid transparent;
  }
  .nav-link:hover {
    color: var(--white);
    background: var(--white-faint);
  }
  .nav-link.active {
    color: var(--blue);
    background: var(--blue-dim);
    border-color: rgba(77,155,253,0.25);
    font-weight: 600;
  }
  .nav-sep {
    width: 1px;
    height: 14px;
    background: var(--border);
    margin: 0 2px;
    flex-shrink: 0;
  }
  .nav-shop {
    margin-left: 8px;
    color: var(--blue);
    border-color: rgba(77,155,253,0.3);
  }
  .nav-shop:hover {
    background: var(--blue);
    color: var(--bg);
    border-color: var(--blue);
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }

  .lang-switcher {
    display: flex;
    gap: 3px;
    background: var(--white-faint);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 3px;
  }
  .lang-btn {
    padding: 4px 12px;
    font-family: 'Orbitron', sans-serif;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 2px;
    border: none;
    background: transparent;
    color: var(--white-dim);
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.22s;
  }
  .lang-btn.active {
    background: var(--blue);
    color: var(--bg);
  }

  /* Hamburger */
  .hamburger {
    display: none;
    flex-direction: column;
    gap: 5px;
    cursor: pointer;
    padding: 6px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    transition: border-color 0.2s;
  }
  .hamburger:hover { border-color: var(--blue); }
  .hamburger span {
    display: block;
    width: 20px;
    height: 2px;
    background: var(--white-dim);
    border-radius: 2px;
    transition: all 0.25s;
  }

  /* Mobile nav overlay */
  .mobile-nav {
    display: none;
    position: fixed;
    top: var(--header-h);
    left: 0; right: 0;
    background: rgba(10,23,40,0.98);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    padding: 12px 24px;
    border-bottom: 1px solid var(--border);
    z-index: 999;
    flex-direction: column;
    gap: 4px;
  }
  .mobile-nav.open { display: flex; }
  .mobile-nav .nav-link {
    justify-content: flex-start;
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 15px;
  }
  .mobile-nav .nav-sep { display: none; }

  @media (max-width: 960px) {
    .header-nav { display: none; }
    .hamburger { display: flex; }
    .header-inner { padding: 0 20px; }
  }
  @media (max-width: 480px) {
    .header-logo { font-size: 15px; letter-spacing: 3px; }
    .lang-btn { padding: 4px 8px; font-size: 8px; }
  }

  /* ═══════════════ HERO ═══════════════ */
  .hero {
    position: relative;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: calc(var(--header-h) + 60px) 40px 80px;
    overflow: hidden;
  }

  .hero-grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(77,155,253,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(77,155,253,0.05) 1px, transparent 1px);
    background-size: 60px 60px;
    animation: gridFade 6s ease-in-out infinite alternate;
  }

  @keyframes gridFade {
    from { opacity: 0.3; }
    to   { opacity: 0.9; }
  }

  .hero-glow {
    position: absolute;
    width: 700px; height: 700px;
    background: radial-gradient(circle, rgba(77,155,253,0.1) 0%, transparent 65%);
    top:50%; left:50%;
    transform: translate(-50%,-50%);
    pointer-events: none;
  }

  .hero-logo {
    position: relative;
    margin-bottom: 28px;
    animation: fadeUp 0.9s ease both;
  }
  .hero-logo svg {
    width: 130px;
    height: 130px;
    filter: drop-shadow(0 0 28px rgba(77,155,253,0.65));
    transition: filter 0.3s;
  }
  .hero-logo:hover svg {
    filter: drop-shadow(0 0 40px rgba(77,155,253,0.85));
  }

  .hero-brand {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: clamp(52px, 9vw, 96px);
    letter-spacing: 14px;
    color: var(--white);
    position: relative;
    animation: fadeUp 0.9s 0.1s ease both;
    text-shadow: 0 0 40px rgba(77,155,253,0.3);
  }
  .hero-brand span { color: var(--blue); }

  .hero-tagline {
    font-size: clamp(13px, 1.8vw, 17px);
    letter-spacing: 3px;
    color: var(--blue);
    text-transform: uppercase;
    font-family: 'Orbitron', sans-serif;
    font-weight: 400;
    margin-top: 12px;
    margin-bottom: 28px;
    animation: fadeUp 0.9s 0.2s ease both;
    opacity: 0;
    animation-fill-mode: both;
  }

  .hero-desc {
    font-size: clamp(16px, 1.8vw, 20px);
    color: var(--white-dim);
    max-width: 600px;
    margin: 0 auto 44px;
    font-style: italic;
    animation: fadeUp 0.9s 0.3s ease both;
  }

  .hero-actions {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    justify-content: center;
    animation: fadeUp 0.9s 0.4s ease both;
  }

  @keyframes fadeUp {
    from { opacity:0; transform: translateY(24px); }
    to   { opacity:1; transform: translateY(0); }
  }

  .hero-scroll {
    position: absolute;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    opacity: 0.4;
    animation: bounce 2s ease-in-out infinite;
  }
  @keyframes bounce {
    0%,100% { transform: translateX(-50%) translateY(0); }
    50%     { transform: translateX(-50%) translateY(8px); }
  }
  .hero-scroll span {
    font-family: 'Orbitron', sans-serif;
    font-size: 9px;
    letter-spacing: 3px;
    color: var(--blue);
  }

  /* ═══════════════ BUTTONS ═══════════════ */
  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 14px 32px;
    background: var(--blue);
    color: var(--bg);
    font-family: 'Noto Sans Georgian', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.5px;
    text-decoration: none;
    border-radius: 8px;
    transition: all 0.25s;
    border: 2px solid var(--blue);
  }
  .btn-primary:hover {
    background: transparent;
    color: var(--blue);
    box-shadow: 0 0 28px var(--blue-glow);
  }

  .btn-outline {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 14px 32px;
    background: transparent;
    color: var(--white);
    font-family: 'Noto Sans Georgian', sans-serif;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 0.5px;
    text-decoration: none;
    border-radius: 8px;
    border: 2px solid var(--border);
    transition: all 0.25s;
  }
  .btn-outline:hover {
    border-color: var(--blue);
    color: var(--blue);
    background: var(--blue-dim);
  }

  /* ═══════════════ SECTIONS ═══════════════ */
  section { position: relative; z-index: 1; }

  .section-inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: 100px 40px;
  }

  .section-label {
    font-family: 'Orbitron', sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 4px;
    color: var(--blue);
    text-transform: uppercase;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .section-label::before {
    content: '';
    display: block;
    width: 32px;
    height: 2px;
    background: linear-gradient(90deg, var(--blue), transparent);
  }

  .section-title {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: clamp(26px, 3.8vw, 42px);
    letter-spacing: 2px;
    margin-bottom: 56px;
    line-height: 1.25;
  }
  .section-title span { color: var(--blue); }

  @media (max-width: 600px) {
    .section-inner { padding: 70px 20px; }
  }

  /* ═══════════════ STATS BAR ═══════════════ */
  .stats-bar {
    background: linear-gradient(135deg, var(--bg2) 0%, #0e2137 100%);
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    position: relative;
    z-index: 1;
  }

  .stats-inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: 48px 40px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 40px;
  }

  .stat-item {
    text-align: center;
    border-right: 1px solid var(--border);
    padding-right: 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .stat-item:last-child { border-right: none; }

  .stat-num {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: 42px;
    background: linear-gradient(135deg, var(--white) 30%, var(--blue) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1;
    margin-bottom: 8px;
    display: flex;
    align-items: baseline;
    gap: 4px;
  }

  .stat-unit {
    font-size: 22px;
    font-weight: 700;
  }

  .stat-label {
    font-family: 'Noto Sans Georgian', sans-serif;
    font-size: 13px;
    color: var(--white-dim);
    letter-spacing: 0.5px;
    font-weight: 500;
  }

  .stat-note {
    font-family: 'Noto Sans Georgian', sans-serif;
    font-size: 10px;
    color: rgba(254,254,254,0.35);
    margin-top: 8px;
    line-height: 1.5;
    max-width: 150px;
    text-align: center;
  }

  @media (max-width: 900px) {
    .stats-inner { grid-template-columns: 1fr 1fr; }
    .stat-item { border-right: none; border-bottom: 1px solid var(--border); padding-bottom: 24px; }
    .stat-item:last-child { border-bottom: none; }
  }
  @media (max-width: 480px) {
    .stats-inner { grid-template-columns: 1fr; }
  }

  /* ═══════════════ SERVICES ═══════════════ */
  .services { background: var(--bg); }

  .services-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
  }

  .service-card {
    background: var(--white-faint);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px 28px;
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
  }
  .service-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 3px; height: 100%;
    background: linear-gradient(180deg, var(--blue) 0%, rgba(77,155,253,0) 100%);
    transform: scaleY(0);
    transform-origin: top;
    transition: transform 0.3s;
  }
  .service-card:hover {
    border-color: var(--blue);
    transform: translateY(-5px);
    box-shadow: 0 12px 40px rgba(77,155,253,0.12);
    background: rgba(77,155,253,0.06);
  }
  .service-card:hover::before { transform: scaleY(1); }

  .service-icon {
    width: 48px; height: 48px;
    background: var(--blue-dim);
    border: 1px solid rgba(77,155,253,0.4);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
    transition: all 0.3s;
  }
  .service-card:hover .service-icon {
    background: var(--blue);
  }
  .service-card:hover .service-icon svg { fill: var(--bg); }
  .service-icon svg { width: 22px; height: 22px; fill: var(--blue); transition: fill 0.3s; }

  .service-title {
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.5px;
    margin-bottom: 10px;
    color: var(--white);
  }
  .service-desc {
    font-size: 15px;
    color: var(--white-dim);
    line-height: 1.65;
  }

  @media (max-width: 900px) {
    .services-grid { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 600px) {
    .services-grid { grid-template-columns: 1fr; }
  }

  /* ═══════════════ INDIVIDUALS / WA SECTION ═══════════════ */
  .individuals { background: var(--bg2); }

  .whatsapp-feature {
    display: grid;
    grid-template-columns: 1fr;
    gap: 40px;
    max-width: 680px;
  }

  .wa-lead {
    font-size: clamp(16px, 1.8vw, 20px);
    color: var(--white-dim);
    margin-bottom: 28px;
    font-family: 'Noto Sans Georgian', sans-serif;
    font-style: normal;
    font-weight: 400;
    line-height: 1.7;
  }

  .wa-steps { display: flex; flex-direction: column; gap: 18px; margin-bottom: 36px; }

  .wa-step { display: flex; gap: 16px; align-items: flex-start; }

  .wa-step-num {
    width: 32px; height: 32px;
    background: var(--blue-dim);
    border: 1px solid var(--blue);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    font-weight: 700;
    color: var(--blue);
    flex-shrink: 0;
  }
  .wa-step-text { font-size: 16px; color: var(--white-dim); padding-top: 4px; font-family: 'Noto Sans Georgian', sans-serif; }
  .wa-step-text strong { color: var(--white); }

  /* ═══════════════ TEAM ═══════════════ */
  .team { background: var(--bg2); }

  .team-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }

  .team-card {
    background: var(--white-faint);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px 20px;
    text-align: center;
    transition: all 0.3s;
  }
  .team-card:hover {
    border-color: var(--blue);
    transform: translateY(-4px);
    box-shadow: 0 10px 30px rgba(77,155,253,0.1);
  }

  .team-avatar {
    width: 68px; height: 68px;
    background: var(--blue-dim);
    border: 2px solid rgba(77,155,253,0.4);
    border-radius: 50%;
    margin: 0 auto 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s;
  }
  .team-card:hover .team-avatar { border-color: var(--blue); background: var(--blue); }
  .team-card:hover .team-avatar svg { fill: var(--bg); }
  .team-avatar svg { width: 30px; height: 30px; fill: var(--blue); transition: fill 0.3s; }

  .team-role {
    font-family: 'Orbitron', sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--blue);
    margin-bottom: 8px;
    text-transform: uppercase;
  }
  .team-desc { font-size: 13px; color: var(--white-dim); line-height: 1.6; }

  @media (max-width: 900px) { .team-grid { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 480px) { .team-grid { grid-template-columns: 1fr; } }

  /* ═══════════════ CONTACT ═══════════════ */
  .contact { background: var(--bg); }

  .contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 72px; align-items: start; }
  .contact-info { display: flex; flex-direction: column; gap: 28px; }
  .contact-item { display: flex; gap: 16px; align-items: flex-start; }

  .contact-icon {
    width: 44px; height: 44px;
    background: var(--blue-dim);
    border: 1px solid rgba(77,155,253,0.3);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.25s;
  }
  .contact-item:hover .contact-icon { background: var(--blue); }
  .contact-item:hover .contact-icon svg { fill: var(--bg); }
  .contact-icon svg { width: 20px; height: 20px; fill: var(--blue); transition: fill 0.25s; }

  .contact-label {
    font-family: 'Orbitron', sans-serif;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--blue);
    margin-bottom: 4px;
  }
  .contact-value { font-size: 17px; color: var(--white); font-family: 'Noto Sans Georgian', sans-serif; }
  .contact-value a { color: inherit; text-decoration: none; }
  .contact-value a:hover { color: var(--blue); }

  .contact-form {
    background: var(--white-faint);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 36px;
  }

  .form-group { margin-bottom: 18px; }
  .form-label {
    display: block;
    font-family: 'Orbitron', sans-serif;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--blue);
    margin-bottom: 8px;
  }
  .form-input, .form-textarea {
    width: 100%;
    background: rgba(10,23,40,0.5);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    color: var(--white);
    font-family: 'Noto Sans Georgian', sans-serif;
    font-size: 15px;
    outline: none;
    transition: border-color 0.25s;
  }
  .form-input:focus, .form-textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 2px var(--blue-dim); }
  .form-textarea { min-height: 120px; resize: vertical; }

  .form-submit {
    width: 100%;
    padding: 14px;
    background: var(--blue);
    color: var(--bg);
    font-family: 'Noto Sans Georgian', sans-serif;
    font-weight: 700;
    font-size: 15px;
    border: 2px solid var(--blue);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.25s;
    margin-top: 6px;
  }
  .form-submit:hover {
    background: transparent;
    color: var(--blue);
    box-shadow: 0 0 20px var(--blue-glow);
  }

  @media (max-width: 900px) { .contact-grid { grid-template-columns: 1fr; gap: 40px; } }

  /* ═══════════════ FOOTER ═══════════════ */
  footer {
    background: rgba(0,0,0,0.45);
    border-top: 1px solid var(--border);
    padding: 48px 40px;
    text-align: center;
    position: relative;
    z-index: 1;
  }

  .footer-brand {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: 20px;
    letter-spacing: 6px;
    margin-bottom: 20px;
  }
  .footer-brand span { color: var(--blue); }

  .footer-links {
    display: flex;
    justify-content: center;
    gap: 28px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .footer-links a {
    font-family: 'Noto Sans Georgian', sans-serif;
    font-size: 12px;
    letter-spacing: 0.5px;
    color: var(--white-dim);
    text-decoration: none;
    transition: color 0.2s;
  }
  .footer-links a:hover { color: var(--blue); }

  .footer-copy { font-size: 12px; color: var(--white-dim); opacity: 0.45; font-family: 'Noto Sans Georgian', sans-serif; }

  /* ═══════════════ LANG VISIBILITY ═══════════════ */
  [data-lang] { display: none; }
  [data-lang].active { display: inline; }
  .block-lang[data-lang] { display: none; }
  .block-lang[data-lang].active { display: block; }

  /* ═══════════════ FLOATING WA ═══════════════ */
  .wa-float {
    position: fixed;
    bottom: 32px; right: 32px;
    width: 58px; height: 58px;
    background: #25d366;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 28px rgba(37,211,102,0.45);
    z-index: 999;
    text-decoration: none;
    transition: transform 0.2s, box-shadow 0.2s;
    animation: waPulse 2.5s ease-in-out infinite;
  }
  @keyframes waPulse {
    0%,100% { box-shadow: 0 8px 28px rgba(37,211,102,0.45); }
    50%      { box-shadow: 0 8px 48px rgba(37,211,102,0.75); }
  }
  .wa-float:hover { transform: scale(1.1); }
  .wa-float svg { width: 28px; height: 28px; fill: white; }

  /* ═══════════════ DIVIDER ═══════════════ */
  .divider { width: 60px; height: 2px; background: linear-gradient(90deg, var(--blue), transparent); margin: 0 auto 40px; }
</style>
