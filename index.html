<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Mokri — Enterprise IT Solutions for Small & Medium Business" />
  <title>Mokri — IT Solutions</title>

  <!-- ===================== FONTS ===================== -->
  <!-- Syne: geometric display font (Latin + Cyrillic) -->
  <!-- Figtree: clean body font                        -->
  <!-- Noto Sans Georgian: Georgian script fallback    -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Figtree:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Noto+Sans+Georgian:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- ===================== TAILWIND CSS ===================== -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink:    { 950: '#03060d', 900: '#060b16', 800: '#0a1020', 700: '#0f1830' },
            sky:    { 400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb' },
            silver: { 100: '#f0f4ff', 200: '#d6dff5', 500: '#8898b8' }
          },
          fontFamily: {
            display: ['"Syne"', '"Noto Sans Georgian"', 'sans-serif'],
            body:    ['"Figtree"', '"Noto Sans Georgian"', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- ===================== CUSTOM CSS ===================== -->
  <style>
    /* ---------- Base ---------- */
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'Figtree', 'Noto Sans Georgian', sans-serif;
      background-color: #060b16;
      color: #d6dff5;
      -webkit-font-smoothing: antialiased;
    }

    /* ---------- Background Textures ---------- */
    .dot-grid {
      background-image: radial-gradient(circle, rgba(96,165,250,0.12) 1px, transparent 1px);
      background-size: 28px 28px;
    }

    .noise-overlay::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      opacity: 0.4;
    }

    /* ---------- Glowing Orbs (Hero decoration) ---------- */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
    }
    .orb-a {
      width: 640px; height: 640px;
      background: radial-gradient(circle, rgba(59,130,246,0.14) 0%, transparent 65%);
      top: -120px; right: -160px;
      animation: drift 9s ease-in-out infinite;
    }
    .orb-b {
      width: 420px; height: 420px;
      background: radial-gradient(circle, rgba(99,102,241,0.10) 0%, transparent 65%);
      bottom: 40px; left: -80px;
      animation: drift 12s ease-in-out infinite reverse;
    }
    @keyframes drift {
      0%,100% { transform: translateY(0) scale(1); }
      50%      { transform: translateY(-28px) scale(1.04); }
    }

    /* ---------- Glass Cards ---------- */
    .glass-card {
      background: rgba(255,255,255,0.025);
      border: 1px solid rgba(255,255,255,0.07);
      transition: background 0.35s, border-color 0.35s, transform 0.35s, box-shadow 0.35s;
    }
    .glass-card:hover {
      background: rgba(59,130,246,0.07);
      border-color: rgba(96,165,250,0.28);
      transform: translateY(-5px);
      box-shadow: 0 24px 64px rgba(59,130,246,0.10);
    }

    /* ---------- Icon Box ---------- */
    .icon-box {
      width: 52px; height: 52px;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(59,130,246,0.18), rgba(37,99,235,0.08));
      border: 1px solid rgba(96,165,250,0.20);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    /* ---------- Number Badge (Why Us) ---------- */
    .num-badge {
      width: 50px; height: 50px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(59,130,246,0.14), rgba(37,99,235,0.04));
      border: 1px solid rgba(96,165,250,0.22);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Syne', sans-serif;
      font-weight: 800; font-size: 17px;
      color: #60a5fa;
      flex-shrink: 0;
    }

    /* ---------- Accent Line ---------- */
    .accent-line {
      width: 44px; height: 3px;
      background: linear-gradient(90deg, #3b82f6, #818cf8);
      border-radius: 99px;
    }

    /* ---------- Horizontal Divider ---------- */
    .h-div {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.07), transparent);
    }

    /* ---------- Primary Button ---------- */
    .btn-primary {
      display: inline-flex; align-items: center; gap: 8px;
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      color: #fff;
      padding: 14px 30px;
      border-radius: 6px;
      font-family: 'Figtree', 'Noto Sans Georgian', sans-serif;
      font-weight: 600; font-size: 15px;
      letter-spacing: 0.01em;
      text-decoration: none;
      border: none; cursor: pointer;
      box-shadow: 0 4px 24px rgba(59,130,246,0.28);
      transition: background 0.3s, box-shadow 0.3s, transform 0.25s;
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%);
      box-shadow: 0 8px 36px rgba(59,130,246,0.45);
      transform: translateY(-2px);
    }

    /* ---------- Navigation Links ---------- */
    .nav-link {
      font-size: 14px; font-weight: 500; letter-spacing: 0.01em;
      color: rgba(214,223,245,0.65);
      text-decoration: none;
      transition: color 0.2s;
    }
    .nav-link:hover { color: #f0f4ff; }

    /* ---------- Language Switcher ---------- */
    .lang-wrap {
      display: flex; align-items: center;
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 6px;
      overflow: hidden;
    }
    .lang-sep { width: 1px; height: 20px; background: rgba(255,255,255,0.10); }
    .lang-btn {
      padding: 5px 10px;
      font-size: 11px; font-weight: 700;
      letter-spacing: 0.08em;
      color: rgba(214,223,245,0.45);
      background: none; border: none; cursor: pointer;
      transition: color 0.2s, background 0.2s;
      font-family: 'Syne', sans-serif;
    }
    .lang-btn:hover { color: #d6dff5; }
    .lang-btn.active {
      color: #60a5fa;
      background: rgba(96,165,250,0.08);
    }

    /* ---------- Header Scroll State ---------- */
    #header {
      transition: background 0.35s, backdrop-filter 0.35s, border-color 0.35s;
    }
    #header.scrolled {
      background: rgba(6,11,22,0.92) !important;
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }

    /* ---------- Mobile Menu ---------- */
    #mobile-menu {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s ease;
    }
    #mobile-menu.open { max-height: 240px; }

    /* ---------- Scroll Reveal ---------- */
    .reveal {
      opacity: 0;
      transform: translateY(28px);
      transition: opacity 0.75s cubic-bezier(.22,.61,.36,1),
                  transform 0.75s cubic-bezier(.22,.61,.36,1);
    }
    .reveal.in { opacity: 1; transform: translateY(0); }

    /* ---------- Scroll Down Arrow ---------- */
    @keyframes bob {
      0%,100% { transform: translateY(0); }
      55%      { transform: translateY(9px); }
    }
    .bob { animation: bob 2s ease-in-out infinite; }

    /* ---------- Top beam ---------- */
    .top-beam {
      position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent 0%, #3b82f6 35%, #818cf8 65%, transparent 100%);
    }

    /* ---------- Responsive overrides ---------- */
    @media (max-width: 767px) {
      .orb-a { width: 320px; height: 320px; }
      .orb-b { width: 220px; height: 220px; }
    }
  </style>
</head>

<script>

/* ----------------------------------------------------------
   2. APPLY LANGUAGE — updates all [data-key] elements
   ---------------------------------------------------------- */
const HTML_LANG_MAP = { ge: 'ka', ru: 'ru', en: 'en' };
let activeLang = 'ge';

function applyLang(lang) {
  activeLang = lang;
  const dict = DICT[lang];

  // Update text / innerHTML for every tagged element
  document.querySelectorAll('[data-key]').forEach(el => {
    const key = el.getAttribute('data-key');
    if (dict[key] !== undefined) {
      el.innerHTML = dict[key];
    }
  });

  // Sync lang-btn active states
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.lang === lang);
  });

  // Update <html lang="...">
  document.documentElement.lang = HTML_LANG_MAP[lang] || lang;
}

// Attach click handlers to language buttons
document.querySelectorAll('.lang-btn').forEach(btn => {
  btn.addEventListener('click', () => applyLang(btn.dataset.lang));
});

// Set default language on page load (Georgian)
applyLang('ge');


/* ----------------------------------------------------------
   3. HEADER — background change on scroll
   ---------------------------------------------------------- */
const header = document.getElementById('header');
window.addEventListener('scroll', () => {
  header.classList.toggle('scrolled', window.scrollY > 64);
}, { passive: true });


/* ----------------------------------------------------------
   4. SCROLL REVEAL — IntersectionObserver
   ---------------------------------------------------------- */
const revealObserver = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add('in');
      // Once revealed, stop observing to save resources
      revealObserver.unobserve(entry.target);
    }
  });
}, {
  threshold: 0.12,
  rootMargin: '0px 0px -50px 0px'
});

document.querySelectorAll('.reveal').forEach(el => revealObserver.observe(el));


/* ----------------------------------------------------------
   5. MOBILE HAMBURGER MENU
   ---------------------------------------------------------- */
const hamburger   = document.getElementById('hamburger');
const mobileMenu  = document.getElementById('mobile-menu');

hamburger.addEventListener('click', () => {
  const isOpen = mobileMenu.classList.toggle('open');
  hamburger.setAttribute('aria-expanded', isOpen);
});

// Close on nav-link click
mobileMenu.querySelectorAll('a').forEach(link => {
  link.addEventListener('click', () => {
    mobileMenu.classList.remove('open');
    hamburger.setAttribute('aria-expanded', 'false');
  });
});

// Close when clicking outside header
document.addEventListener('click', e => {
  if (!header.contains(e.target)) {
    mobileMenu.classList.remove('open');
    hamburger.setAttribute('aria-expanded', 'false');
  }
});
