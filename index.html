<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mokri — To-Do</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0f1a;
      --panel: #101827;
      --panel-border: #1f2a44;
      --text: #dce6ff;
      --muted: #8ea0c9;
      --accent: #5ca9ff;
      --accent-strong: #3b8df0;
      --danger: #ff5f7d;
      --ok: #5cd6a5;
      --radius: 14px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, Roboto, "Segoe UI", sans-serif;
      font-weight: 700;
      letter-spacing: 0.01em;
      background:
        radial-gradient(circle at 10% -20%, #172742 0%, transparent 45%),
        radial-gradient(circle at 90% 120%, #15263f 0%, transparent 40%),
        var(--bg);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .app {
      width: min(720px, 100%);
      background: rgba(16, 24, 39, 0.92);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
      overflow: hidden;
      backdrop-filter: blur(6px);
    }

    .header {
      padding: 20px;
      border-bottom: 1px solid var(--panel-border);
      display: flex;
      gap: 14px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    .title {
      margin: 0;
      font-size: clamp(1.2rem, 2.8vw, 1.55rem);
      font-weight: 800;
    }

    .stats {
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 700;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      padding: 20px;
      border-bottom: 1px solid var(--panel-border);
    }

    input[type="text"] {
      border: 1px solid #233251;
      outline: none;
      border-radius: 12px;
      background: #0a1220;
      color: var(--text);
      padding: 12px 14px;
      font: inherit;
      font-weight: 700;
      transition: border-color .2s ease, box-shadow .2s ease;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(92, 169, 255, 0.2);
    }

    button {
      border: 0;
      border-radius: 12px;
      cursor: pointer;
      font: inherit;
      font-weight: 800;
      transition: transform .15s ease, opacity .2s ease, background .2s ease;
    }

    button:active { transform: scale(0.97); }

    .add-btn {
      background: var(--accent);
      color: #031126;
      padding: 12px 16px;
      min-width: 92px;
    }

    .add-btn:hover { background: var(--accent-strong); }

    .task-list {
      list-style: none;
      margin: 0;
      padding: 14px;
      display: grid;
      gap: 10px;
    }

    .task {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 10px;
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 10px;
      animation: fadeIn .22s ease;
    }

    .task.done {
      border-color: rgba(92, 214, 165, 0.3);
      background: rgba(16, 24, 39, 0.78);
    }

    .toggle-btn,
    .delete-btn {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      font-size: 0.95rem;
      border: 1px solid #293a5c;
      color: var(--text);
      background: #0f182b;
    }

    .toggle-btn[aria-pressed="true"] {
      background: rgba(92, 214, 165, 0.16);
      color: var(--ok);
      border-color: rgba(92, 214, 165, 0.4);
    }

    .delete-btn {
      color: #ff9db1;
      border-color: rgba(255, 95, 125, 0.35);
      background: rgba(255, 95, 125, 0.08);
    }

    .task-text {
      font-weight: 700;
      overflow-wrap: anywhere;
      transition: color .2s ease, opacity .2s ease;
    }

    .task.done .task-text {
      color: var(--muted);
      text-decoration: line-through;
      opacity: 0.75;
    }

    .empty-state {
      margin: 0;
      padding: 26px 20px 28px;
      text-align: center;
      color: var(--muted);
      font-size: .96rem;
      border-top: 1px dashed rgba(142, 160, 201, 0.25);
    }

    .empty-state.hidden { display: none; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 560px) {
      .controls { grid-template-columns: 1fr; }
      .add-btn { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="app" aria-label="To-do app">
    <header class="header">
      <h1 class="title">Mokri Tasks</h1>
      <div id="task-stats" class="stats" aria-live="polite">0 total, 0 completed</div>
    </header>

    <section class="controls" aria-label="Add task">
      <input id="task-input" type="text" maxlength="180" placeholder="Add a new task..." aria-label="Task input" />
      <button id="add-task-btn" class="add-btn" type="button">Add</button>
    </section>

    <ul id="task-list" class="task-list" aria-label="Task list"></ul>
    <p id="empty-state" class="empty-state">No tasks yet. Add your first task.</p>
  </main>

  <script>
    const STORAGE_KEY = 'mokri-tasks-v1';
    const taskInput = document.getElementById('task-input');
    const addTaskButton = document.getElementById('add-task-btn');
    const taskList = document.getElementById('task-list');
    const taskStats = document.getElementById('task-stats');
    const emptyState = document.getElementById('empty-state');
    let fallbackIdCounter = 0;

    let tasks = loadTasks();

    function loadTasks() {
      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (!stored) return [];
        const parsed = JSON.parse(stored);
        if (!Array.isArray(parsed)) return [];
        return parsed.reduce((acc, task) => {
          if (!task || typeof task.id !== 'string' || typeof task.text !== 'string') return acc;
          const text = task.text.trim();
          if (!text) return acc;
          const done = typeof task.done === 'boolean' ? task.done : false;
          acc.push({ id: task.id, text, done });
          return acc;
        }, []);
      } catch {
        return [];
      }
    }

    function createTaskId() {
      if (window.crypto && typeof window.crypto.randomUUID === 'function') {
        return window.crypto.randomUUID();
      }
      if (window.crypto && typeof window.crypto.getRandomValues === 'function') {
        const randomBuffer = new Uint32Array(2);
        window.crypto.getRandomValues(randomBuffer);
        return `${Date.now()}-${randomBuffer[0].toString(16)}${randomBuffer[1].toString(16)}`;
      }
      fallbackIdCounter = (fallbackIdCounter + 1) % Number.MAX_SAFE_INTEGER;
      return `${Date.now()}-${fallbackIdCounter}`;
    }

    function saveTasks() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    }

    function updateStats() {
      const completed = tasks.filter(task => task.done).length;
      taskStats.textContent = `${tasks.length} total, ${completed} completed`;
      emptyState.classList.toggle('hidden', tasks.length > 0);
    }

    function createTaskElement(task) {
      const item = document.createElement('li');
      item.className = `task${task.done ? ' done' : ''}`;
      item.dataset.id = task.id;

      const toggleButton = document.createElement('button');
      toggleButton.type = 'button';
      toggleButton.className = 'toggle-btn';
      toggleButton.setAttribute('aria-label', task.done ? 'Mark as not done' : 'Mark as done');
      toggleButton.setAttribute('aria-pressed', String(task.done));
      toggleButton.textContent = task.done ? '✓' : '○';

      const text = document.createElement('span');
      text.className = 'task-text';
      text.textContent = task.text;

      const deleteButton = document.createElement('button');
      deleteButton.type = 'button';
      deleteButton.className = 'delete-btn';
      deleteButton.setAttribute('aria-label', 'Delete task');
      deleteButton.textContent = '✕';

      item.append(toggleButton, text, deleteButton);
      return item;
    }

    function renderTasks() {
      taskList.textContent = '';
      tasks.forEach(task => {
        taskList.appendChild(createTaskElement(task));
      });
      updateStats();
    }

    function addTask() {
      const text = taskInput.value.trim();
      if (!text) {
        taskInput.focus();
        return;
      }

      tasks.unshift({
        id: createTaskId(),
        text,
        done: false
      });

      saveTasks();
      renderTasks();
      taskInput.value = '';
      taskInput.focus();
    }

    function toggleTask(id) {
      tasks = tasks.map(task => task.id === id ? { ...task, done: !task.done } : task);
      saveTasks();
      renderTasks();
    }

    function deleteTask(id) {
      tasks = tasks.filter(task => task.id !== id);
      saveTasks();
      renderTasks();
    }

    addTaskButton.addEventListener('click', addTask);

    taskInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        addTask();
      }
    });

    taskList.addEventListener('click', (event) => {
      const row = event.target.closest('.task');
      if (!row) return;

      if (event.target.closest('.toggle-btn')) {
        toggleTask(row.dataset.id);
      }

      if (event.target.closest('.delete-btn')) {
        deleteTask(row.dataset.id);
      }
    });

    renderTasks();
  </script>
</body>
</html>
